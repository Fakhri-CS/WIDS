[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"


[project]
name = "wids"
version = "0.1.0"
description = "Rule-based Wireless Intrusion Detection System"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "Flask>=3.1,<4",
    "python-dotenv>=1,<2",
]


[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "pytest-mock>=3,<4",
    "ruff>=0.9,<1",
    "mypy>=1.13,<2",
]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"


[tool.ruff]
line-length = 100
target-version = "py312"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]


[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
